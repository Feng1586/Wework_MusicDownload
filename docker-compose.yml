version: '3.8'

services:
  musicdl:
    image: 66211900/wecom-musicdl:latest
    container_name: musicdl
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      # 企业微信配置：全部来自同目录下的 .env（compose 会自动加载该文件）
      # 这里刻意不写任何默认值，凭据一律不进仓库。
      # 用 ${VAR:?} 而不是 ${VAR}，是为了在 .env 缺失/漏填时直接报错退出，
      # 而不是拿空凭据静默启动、到运行时才报一句看不懂的“微信验证失败”。
      # 首次部署：cp .env.example .env，填好后再 up。
      - "STOKEN=${STOKEN:?请在 .env 中设置 STOKEN}"
      - "S_ENCODING_AES_KEY=${S_ENCODING_AES_KEY:?请在 .env 中设置 S_ENCODING_AES_KEY}"
      - "S_CORP_ID=${S_CORP_ID:?请在 .env 中设置 S_CORP_ID}"
      - "AGENT_ID=${AGENT_ID:?请在 .env 中设置 AGENT_ID}"
      - "SECRET=${SECRET:?请在 .env 中设置 SECRET}"
      - "WECHAT_PROXY=${WECHAT_PROXY:?请在 .env 中设置 WECHAT_PROXY}"
      # 可选的本地兜底搜索 Cookie，留空即匿名搜索。
      # 用 :- 给空默认值：没配也要能正常启动，不参与必填校验。
      - "QQ_VIP_COOKIES=${QQ_VIP_COOKIES:-}"
      - "MIGU_VIP_COOKIES=${MIGU_VIP_COOKIES:-}"
      - "NETEASE_VIP_COOKIES=${NETEASE_VIP_COOKIES:-}"
      - "KUWO_VIP_COOKIES=${KUWO_VIP_COOKIES:-}"
      - "QIANQIAN_VIP_COOKIES=${QIANQIAN_VIP_COOKIES:-}"
    volumes:
      # 持久化下载的音乐文件
      - ./downloads:/app/downloads
      # 一般不需要挂载配置：镜像内的 config/config.py 由 Dockerfile 从
      # config.example.py 生成，凭据统一走上面的环境变量。
      # 只有在需要覆盖非凭据类配置（如 music 源列表）时才启用下面这行，
      # 且挂载的是主机文件，不会进入镜像层。
      # - ./config/config.py:/app/config/config.py:ro
    networks:
      - musicdl-network

  watchtower_musicdl:
    image: docker.1ms.run/nickfedor/watchtower
    container_name: watchtower_musicdl
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      --cleanup
      --interval 3600
      musicdl

networks:
  musicdl-network:
    driver: bridge